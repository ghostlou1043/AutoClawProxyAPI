services:
  autoclaw2api:
    image: ghcr.io/ghostlou1043/autoclawproxyapi:latest
    container_name: autoclaw2api
    restart: unless-stopped

    # 端口映射：宿主机端口:容器端口
    # 容器内程序默认监听 8080（由 config.json 的 listen 字段决定）
    # 如果你想改宿主机暴露端口，只改冒号左边即可，例如 "9000:8080"
    ports:
      - "8080:8080"

    environment:
      TZ: Asia/Shanghai

    volumes:
      # 配置文件
      - ./app:/app/
